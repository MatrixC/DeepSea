name: BuildRelease

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: src

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - id: set-version
      run: |
        version=$(python -c 'import sys, json; f=open("./settings.json");print(json.loads(f.read())["releaseVersion"])')
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        if [ -f ../requirements.txt ]; then pip3 install -r ../requirements.txt; fi

    - name: Create DeepSea Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python ./start.py -gt="$GITHUB_TOKEN"
        ls -l ./*.zip

    - name: Upload workflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deepsea-${{ steps.set-version.outputs.version }}
        path: src/*.zip
        if-no-files-found: error

    - name: Create or refresh release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="v${{ steps.set-version.outputs.version }}"
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release upload "$tag" ./*.zip --clobber
        else
          gh release create "$tag" ./*.zip --title "Release $tag" --notes "Built from $GITHUB_SHA"
        fi
